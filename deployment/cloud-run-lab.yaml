apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: limitmark-public-inquiry-lab
  annotations:
    run.googleapis.com/ingress: internal-and-cloud-load-balancing
    run.googleapis.com/execution-environment: gen2
    run.googleapis.com/launch-stage: BETA
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "2"
        run.googleapis.com/container-dependencies: '{"app":["collector"]}'
    spec:
      containerConcurrency: 2
      timeoutSeconds: 30
      serviceAccountName: limitmark-lab-app@PROJECT_ID.iam.gserviceaccount.com
      containers:
        - name: app
          image: REGION-docker.pkg.dev/PROJECT_ID/limitmark/limitmark-app:IMAGE_TAG
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          env:
            - name: PORT
              value: "8080"
            - name: LIMITMARK_RUNTIME
              value: cloud-run-lab
            - name: REQUEST_SUBMISSION_MODE
              value: postgres
            - name: ENABLE_PERSISTENT_SUBMISSIONS
              value: "true"
            - name: PUBLIC_ORIGIN_PROTECTION
              value: required
            - name: PUBLIC_INQUIRY_OTEL_METRICS
              value: "true"
            - name: PUBLIC_INQUIRY_OTEL_METRICS_ENDPOINT
              value: http://127.0.0.1:4318/v1/metrics
            - name: PUBLIC_INQUIRY_OTEL_METRICS_SERVICE
              value: limitmark-public-inquiry-lab
            - name: LAB_PUBLIC_HOSTNAME
              value: LAB_HOSTNAME
            # Must exactly match the Google ID-token audience accepted by the
            # isolated admission Worker and requested from the metadata server.
            - name: LAB_ADMISSION_OIDC_AUDIENCE
              value: https://ADMISSION_HOSTNAME
            - name: LAB_DEPLOYMENT_ID
              value: LAB_DEPLOYMENT_ID
            - name: LAB_ADMISSION_RELEASE_ID
              value: LAB_DEPLOYMENT_ID
            - name: LAB_ADMISSION_SERVICE_URL
              value: https://ADMISSION_HOSTNAME/
            - name: LAB_DATABASE_POOL_MAX
              value: "5"
            - name: LAB_PUBLIC_ORIGIN_SECRET
              valueFrom:
                secretKeyRef:
                  name: limitmark-lab-public-origin-secret
                  key: latest
            - name: LAB_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: limitmark-lab-database-url
                  key: latest
            - name: LAB_INGRESS_AUDIENCE
              valueFrom:
                secretKeyRef:
                  name: limitmark-lab-ingress-audience
                  key: latest
            - name: LAB_INGRESS_PUBLIC_KEYS
              valueFrom:
                secretKeyRef:
                  name: limitmark-lab-ingress-public-keys
                  key: latest
            - name: LAB_INGRESS_REQUEST_BINDING_KEY
              valueFrom:
                secretKeyRef:
                  name: limitmark-lab-ingress-request-binding-key
                  key: latest
            - name: LAB_ADMISSION_RELEASE_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: limitmark-lab-admission-release-key-id
                  key: latest
            - name: LAB_ADMISSION_RELEASE_RPC_KEY
              valueFrom:
                secretKeyRef:
                  name: limitmark-lab-admission-release-rpc-key
                  key: latest
            - name: LAB_TURNSTILE_SITE_KEY
              valueFrom:
                secretKeyRef:
                  name: limitmark-lab-turnstile-site-key
                  key: latest
            - name: LAB_TURNSTILE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: limitmark-lab-turnstile-secret-key
                  key: latest
            - name: LAB_TURNSTILE_EXPECTED_HOSTNAME
              value: LAB_HOSTNAME
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.136.0
          args:
            - --config=/etc/otelcol-contrib/config.yaml
          resources:
            limits:
              cpu: "0.25"
              memory: 128Mi
          env:
            - name: GOOGLE_CLOUD_PROJECT
              value: PROJECT_ID
          volumeMounts:
            - name: collector-config
              mountPath: /etc/otelcol-contrib
      volumes:
        - name: collector-config
          secret:
            secretName: limitmark-lab-otel-collector-config
