name: BA0 Salvo CI

on:
  pull_request:
    branches:
      - ba0-n2-salvo
      - ba0-n2-progression
      - master
  push:
    branches:
      - ci/ba0-salvo-validation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ba0-salvo-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test suite (no external field traffic)
        run: npm test
